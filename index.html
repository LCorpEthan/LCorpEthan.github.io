<!DOCTYPE html>
<html lang="en">
<head>

    <title>My Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;

        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        nav {
            background-color: #444;
            padding: 0.5rem;
        }
        nav a {

            text-decoration: none;

            margin: 0 0.5rem;
            display: inline-block;
        }
        nav a:hover {
            background-color: #555;
        }
        main {
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        footer {
            background-color: #333;

            text-align: center;
            padding: 1rem;

    <nav>

        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <section id="about">
            <h2>About Me</h2>
            <p>This is a placeholder section for information about you and your background.</p>

        <section id="projects">

    <footer>
